name: Update RSS feed
on:
  schedule:
    - cron: "0 * * * *"      # 備援；主要由 cron-job.org 每 15 分鐘觸發
  workflow_dispatch:          # cron-job.org / 手動執行都走這裡
permissions:
  contents: write
concurrency:                  # 避免兩次執行同時 push 互相衝突
  group: feed
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml
      - run: python generate_feed.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml seen.json
          # 只有項目變動才 commit（忽略 lastBuildDate）
          if git diff --cached --quiet -I'lastBuildDate'; then
            echo "No changes"
          else
            git commit -m "Update feed" && git push
          fi
